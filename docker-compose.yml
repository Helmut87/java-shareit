version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: shareit-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: shareit
      POSTGRES_PASSWORD: shareit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shareit-network

networks:
  shareit-network:
    driver: bridge

volumes:
  postgres-data: